version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aphring
      POSTGRES_PASSWORD: aphring_secret
      POSTGRES_DB: aphring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aphring -d aphring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aphring

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aphring
      MINIO_ROOT_PASSWORD: aphring_minio_secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aphring

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aphring:aphring_secret@postgres:5432/aphring?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: aphring
      MINIO_SECRET_KEY: aphring_minio_secret
      MINIO_BUCKET: aphring-documents
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    networks:
      - aphring

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - aphring

volumes:
  postgres_data:
  minio_data:

networks:
  aphring:
    driver: bridge
